; Feather RP2350 (Adafruit "adafruit_feather_rp2350" in CircuitPython = HSTX/PSRAM board)
; Arduino-Pico (Earle Philhower core) through the maxgerhardt PlatformIO platform.
[env:feather_rp2350]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = adafruit_feather_rp2350_hstx
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
