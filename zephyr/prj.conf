CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_PICOLIBC=y

CONFIG_I2C=y

# USB CDC-ACM serial for the CLI (new USB device stack)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_SAMPLE_USBD_PID=0x0001
CONFIG_SAMPLE_USBD_PRODUCT="Experiment NFC (Zephyr)"
CONFIG_SAMPLE_USBD_MANUFACTURER="Experiment"

CONFIG_MAIN_STACK_SIZE=6144
CONFIG_UDC_BUF_COUNT=32
CONFIG_UDC_BUF_POOL_SIZE=4096
CONFIG_GPIO=y

# Tag emulation logs events with microsecond timestamps (the RP2350 timer runs at 1 MHz).
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000000
